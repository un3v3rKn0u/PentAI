[package]
name = "pentai-desktop"
version = "0.1.0"
description = "PentAI desktop shell"
authors = ["PentAI contributors"]
edition = "2021"

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
