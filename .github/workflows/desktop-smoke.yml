name: Desktop smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/ui/**"
      - "packages/policy/**"
      - "services/core/**"
      - "schemas/**"
      - "migrations/**"
      - "scripts/build_core_sidecar.py"
      - "scripts/core_sidecar_entry.py"
      - "scripts/smoke_core_sidecar.py"
      - "scripts/smoke_desktop_bundle.py"
      - "pyproject.toml"
      - ".github/workflows/desktop-smoke.yml"

permissions:
  contents: read

jobs:
  tauri-check:
    name: Tauri check (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Build native core sidecar
        run: python scripts/build_core_sidecar.py
      - name: Test authenticated core sidecar lifecycle
        run: python scripts/smoke_core_sidecar.py
      - run: pnpm --filter @pentai/ui build
      - run: cargo check --manifest-path apps/desktop/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/Cargo.toml
      - name: Confirm Linux release distribution is blocked by the glib advisory gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          output=$(cargo check --manifest-path apps/desktop/Cargo.toml --features release-distribution 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Linux release gate unexpectedly allowed a distribution build"
            exit 1
          fi
          if ! grep -Fq "PENTAI-LINUX-RELEASE-BLOCKED-GHSA-WRW7-89JP-8Q8G" <<<"$output"; then
            echo "Linux distribution build failed outside the expected advisory gate"
            exit 1
          fi
      - name: Bundle release desktop with embedded sidecar identity
        working-directory: apps/desktop
        run: >-
          python ../../scripts/retry_transient_command.py --attempts 3 --base-delay 10 --
          pnpm exec tauri build --bundles ${{ matrix.bundle }}
          --features bootstrap-smoke
      - name: Test bundled desktop bootstrap lifecycle
        timeout-minutes: 2
        run: python scripts/smoke_desktop_bundle.py
