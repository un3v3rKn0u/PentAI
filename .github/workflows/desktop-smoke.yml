name: Desktop smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/ui/**"
      - "packages/policy/**"
      - "services/core/**"
      - "schemas/**"
      - "migrations/**"
      - "scripts/build_core_sidecar.py"
      - "scripts/core_sidecar_entry.py"
      - "scripts/smoke_core_sidecar.py"
      - "scripts/smoke_desktop_bundle.py"
      - "pyproject.toml"
      - ".github/workflows/desktop-smoke.yml"

permissions:
  contents: read

jobs:
  tauri-check:
    name: Tauri check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Build native core sidecar
        run: python scripts/build_core_sidecar.py
      - name: Test authenticated core sidecar lifecycle
        run: python scripts/smoke_core_sidecar.py
      - run: pnpm --filter @pentai/ui build
      - run: cargo check --manifest-path apps/desktop/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/Cargo.toml
      - name: Bundle release desktop with embedded sidecar identity
        working-directory: apps/desktop
        run: >-
          pnpm exec tauri build --bundles ${{ matrix.bundle }}
          --features bootstrap-smoke
      - name: Test bundled desktop bootstrap lifecycle
        run: python scripts/smoke_desktop_bundle.py
