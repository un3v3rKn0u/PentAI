name: Network containment conformance

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/network-probe/**"
      - "scripts/run_network_probe_conformance.py"
      - "scripts/owned_fixture_authority.py"
      - "services/core/src/pentai_core/managed_gateway_network.py"
      - "services/core/src/pentai_core/gateway_http_fixture.py"
      - "services/core/src/pentai_core/authorization.py"
      - "services/core/src/pentai_core/runtime_snapshot_collector.py"
      - "services/core/src/pentai_core/gateway_runtime_lifecycle.py"
      - "services/core/src/pentai_core/gateway_runtime_composition.py"
      - "services/core/src/pentai_core/gateway_runtime_supervisor.py"
      - "services/core/src/pentai_core/config.py"
      - "services/core/src/pentai_core/main.py"
      - "migrations/0011_gateway_runtime_lifecycle.sql"
      - "migrations/0017_gateway_fixture_execution_claims.sql"
      - "schemas/v1/gateway-runtime-instance-v1.schema.json"
      - "schemas/v1/gateway-fixture-execution-claim-v1.schema.json"
      - ".github/workflows/network-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless-podman:
    name: Rootless Podman TEST-NET bypass matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install rootless Podman build support
        run: |
          sudo apt-get update
          sudo apt-get install -y podman slirp4netns uidmap
      - name: Install PentAI host-side verifier
        run: python -m pip install -e .
      - name: Build and unit-test dependency-free probe
        run: |
          cargo test --manifest-path tools/network-probe/Cargo.toml
          cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path tools/network-probe/Cargo.toml
      - name: Confirm static Linux artifact
        run: |
          probe=tools/network-probe/target/x86_64-unknown-linux-musl/release/pentai-network-probe
          file "$probe"
          readelf --program-headers "$probe"
          if readelf --program-headers "$probe" | grep -Fq INTERP; then
            echo "Probe unexpectedly requires a dynamic program interpreter"
            exit 1
          fi
      - name: Run rootless containment probes using only TEST-NET destinations
        env:
          PYTHONPATH: services/core/src:packages/policy/src
        run: |
          runtime=/usr/bin/podman
          test -f "$runtime"
          test -x "$runtime"
          test ! -w "$runtime"
          python scripts/run_network_probe_conformance.py \
            --runtime podman \
            --executable "$runtime" \
            --probe-binary tools/network-probe/target/x86_64-unknown-linux-musl/release/pentai-network-probe
