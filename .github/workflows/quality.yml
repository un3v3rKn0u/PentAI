name: Quality

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: pip-audit
      - run: python scripts/validate_contracts.py
      - name: Build and smoke-test wheel
        run: |
          python -m build --wheel
          python -m venv /tmp/pentai-wheel
          /tmp/pentai-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/pentai-wheel/bin/python -c "from pentai_policy.document import contract_issues; assert contract_issues({}, 'engagement-manifest-v2.schema.json')"

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migration:
    name: SQLite migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: PYTHONPATH=services/core/src:packages/policy/src python -m unittest tests.test_migrations
