[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pentai"
version = "0.1.0"
description = "Local-first supervised authorized security assessment platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "jsonschema[format]>=4.23,<5",
  "mypy>=1.11,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1"
]

[tool.hatch.build.targets.wheel]
packages = [
  "services/core/src/pentai_core",
  "packages/policy/src/pentai_policy"
]

[tool.pytest.ini_options]
pythonpath = ["services/core/src", "packages/policy/src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pentai_core", "pentai_policy"]
mypy_path = ["services/core/src", "packages/policy/src"]
